<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Split — receipt splitter</title>
<meta name="description" content="Split a receipt among friends: assign each item to whoever shared it, and tax and tip get divided in proportion to what everyone actually ordered." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%BE</text></svg>" />
<style>
  :root {
    --paper:      #F2F4F0;
    --surface:    #FBFCFA;
    --surface-2:  #EAEEE8;
    --ink:        #16211F;
    --ink-soft:   #3D4A46;
    --muted:      #6B766F;
    --rule:       #D6DBD2;
    --rule-soft:  #E4E8DF;
    --accent:     #1F6F5C;
    --accent-ink: #FFFFFF;
    --danger:     #A8402F;
    --focus:      #1F6F5C;

    --p1: #B44A2E;
    --p2: #2C6BA0;
    --p3: #6F4FA3;
    --p4: #8A6A00;
    --p5: #A03A63;
    --p6: #0C6E78;
    --chip-fg: #FFFFFF;

    --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --r: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #121816;
      --surface:    #1A211E;
      --surface-2:  #222A27;
      --ink:        #E8EDE8;
      --ink-soft:   #B9C2BC;
      --muted:      #8B968F;
      --rule:       #333D39;
      --rule-soft:  #262E2B;
      --accent:     #57BFA1;
      --accent-ink: #0B1210;
      --danger:     #E0806E;
      --focus:      #57BFA1;

      --p1: #D2664A;
      --p2: #4A8FC4;
      --p3: #9174C7;
      --p4: #B08B1E;
      --p5: #C25C86;
      --p6: #2295A1;
      --chip-fg: #101614;
    }
  }

  :root[data-theme="dark"] {
    --paper:      #121816;
    --surface:    #1A211E;
    --surface-2:  #222A27;
    --ink:        #E8EDE8;
    --ink-soft:   #B9C2BC;
    --muted:      #8B968F;
    --rule:       #333D39;
    --rule-soft:  #262E2B;
    --accent:     #57BFA1;
    --accent-ink: #0B1210;
    --danger:     #E0806E;
    --focus:      #57BFA1;

    --p1: #D2664A;
    --p2: #4A8FC4;
    --p3: #9174C7;
    --p4: #B08B1E;
    --p5: #C25C86;
    --p6: #2295A1;
    --chip-fg: #101614;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button, input { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 140px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }

  .brand h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .brand p {
    margin: 4px 0 0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .masthead-actions { display: flex; gap: 8px; }

  /* ---------- buttons ---------- */

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--muted); }
  .btn-solid {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .btn-solid:hover { background: var(--ink-soft); border-color: var(--ink-soft); color: var(--paper); }
  .btn-quiet { border-color: transparent; color: var(--muted); padding: 6px 8px; }
  .btn-quiet:hover { background: var(--surface-2); }
  .btn-danger:hover { color: var(--danger); border-color: var(--danger); background: transparent; }

  .icon-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--r);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    flex: none;
  }
  .icon-btn:hover { color: var(--danger); background: var(--surface-2); }

  /* ---------- layout ---------- */

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
    margin-top: 24px;
  }

  .ledger { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 16px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- people ---------- */

  .people-list { display: flex; flex-wrap: wrap; gap: 8px; }

  .person-tag {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px 4px 3px 10px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--surface);
  }
  .person-tag::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--c);
    margin-right: 6px;
    flex: none;
  }
  .person-tag input {
    border: 0;
    background: transparent;
    width: 8ch;
    min-width: 4ch;
    padding: 2px 0;
    font-size: 14px;
    font-weight: 500;
  }
  .person-tag .icon-btn { width: 22px; height: 22px; font-size: 15px; }

  /* ---------- items ---------- */

  .askrow {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .askrow[hidden] { display: none; }
  .askrow input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    background: var(--paper);
    font-size: 14px;
  }
  .askrow input::placeholder { color: var(--muted); }
  .askrow input:focus { outline: none; border-color: var(--focus); background: var(--surface); }
  .askrow button { flex: none; }
  .askrow.busy input { opacity: .6; }

  .change {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-top: 1px solid var(--rule-soft);
  }
  .change:first-of-type { border-top: 0; }
  .change-name { font-weight: 500; }
  .change-who { font-size: 13px; text-align: right; }
  .change-who .none { color: var(--muted); font-style: italic; }
  .change-who b { font-weight: 600; }

  .items { display: flex; flex-direction: column; gap: 8px; }

  .item {
    border: 1px solid var(--rule-soft);
    border-radius: var(--r);
    padding: 10px 10px 10px 12px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .item.orphan { border-color: var(--danger); }

  .item-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 100px 28px;
    gap: 8px;
    align-items: center;
  }

  .field {
    width: 100%;
    padding: 6px 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r);
    transition: border-color .12s ease, background-color .12s ease;
  }
  .field:hover { border-color: var(--rule-soft); }
  .field:focus { border-color: var(--rule); background: var(--paper); outline: none; }

  .field-name { font-weight: 500; }

  .field-price {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    border-color: var(--rule-soft);
  }

  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .chip {
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:hover { border-color: var(--c); color: var(--c); }
  .chip[aria-pressed="true"] {
    background: var(--c);
    border-color: var(--c);
    color: var(--chip-fg);
  }

  .chip-all {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-style: dashed;
  }
  .chip-all:hover { color: var(--ink); border-color: var(--muted); }

  .split-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .split-note.warn { color: var(--danger); }

  .empty {
    padding: 22px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    border: 1px dashed var(--rule);
    border-radius: var(--r);
  }

  /* ---------- charges ---------- */

  .charge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
  }

  .charge label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .charge-input {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    overflow: hidden;
  }
  .charge-input:focus-within { border-color: var(--focus); }
  .charge-input input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .charge-input input:focus { outline: none; }

  .seg { display: flex; border-left: 1px solid var(--rule); }
  .seg button {
    width: 34px;
    border: 0;
    background: var(--surface-2);
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .presets:empty { display: none; }
  .presets button {
    padding: 5px 10px;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12.5px;
    line-height: 1.3;
    text-align: center;
    transition: border-color .12s ease, color .12s ease, background-color .12s ease;
  }
  .presets button:hover { border-color: var(--muted); color: var(--ink); }
  .presets button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .presets button span {
    display: block;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    opacity: .72;
  }

  .charge-hint {
    margin: 6px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  /* ---------- receipt ---------- */

  .receipt {
    position: sticky;
    top: 20px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-bottom: 0;
    border-radius: var(--r) var(--r) 0 0;
    padding: 18px 18px 22px;
    --tw: 12px;
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000 90deg, #000 0) bottom / var(--tw) 100% repeat-x;
    mask: conic-gradient(from -45deg at bottom, #0000 90deg, #000 0) bottom / var(--tw) 100% repeat-x;
  }

  .receipt-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .receipt-head strong {
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .tally { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; }
  .tally-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .tally-row.total {
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
  }
  .tally-row.total .amt { color: var(--accent); }

  .splits { display: flex; flex-direction: column; gap: 2px; }

  .split {
    border-top: 1px dashed var(--rule);
    padding: 10px 0 10px 11px;
    position: relative;
  }
  .split::before {
    content: "";
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 2px;
    background: var(--c);
  }
  .split-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .split-name { font-weight: 600; color: var(--c); }
  .split-amt {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 600;
  }
  .split-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .lines {
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .lines li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .lines .sub { color: var(--ink-soft); border-top: 1px solid var(--rule-soft); padding-top: 4px; margin-top: 3px; }
  .lines .grand {
    color: var(--ink);
    font-weight: 600;
    font-size: 12.5px;
    border-top: 1px solid var(--rule);
    padding-top: 4px;
    margin-top: 3px;
  }

  /* ---------- share view ---------- */

  .share-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 4px;
  }
  .share-head .amt {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    color: var(--accent);
  }
  .share-head .eyebrow { display: block; margin-bottom: 2px; }

  .share-block {
    border-top: 1px dashed var(--rule);
    padding: 12px 0 12px 11px;
    position: relative;
  }
  .share-block::before {
    content: "";
    position: absolute;
    left: 0; top: 14px; bottom: 14px;
    width: 3px;
    border-radius: 2px;
    background: var(--c);
  }
  .share-name {
    font-weight: 600;
    color: var(--c);
    margin-bottom: 5px;
  }
  .share-lines {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .share-lines div {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .share-lines div.sub { color: var(--ink-soft); border-top: 1px solid var(--rule-soft); padding-top: 4px; margin-top: 2px; }
  .share-lines div.grand {
    color: var(--ink);
    font-weight: 600;
    font-size: 12.5px;
    border-top: 1px solid var(--rule);
    padding-top: 4px;
    margin-top: 2px;
  }

  .receipt-foot {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.08em;
  }

  .flag {
    margin-top: 10px;
    padding: 8px 10px;
    border: 1px solid var(--danger);
    border-radius: var(--r);
    color: var(--danger);
    font-size: 12.5px;
  }

  /* ---------- mobile total bar ---------- */

  .totalbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--rule);
    z-index: 10;
  }
  .totalbar .amt {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    font-weight: 600;
    color: var(--accent);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translate(-50%, 12px);
    padding: 9px 16px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 860px) {
    .wrap { padding: 20px 14px 120px; }
    .layout { grid-template-columns: 1fr; }
    .receipt { position: static; }
    .totalbar { display: flex; }
    .item-top { grid-template-columns: minmax(0, 1fr) 88px 28px; }
    .brand h1 { font-size: 21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- scanner ---------- */

  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 11, .55);
    display: grid;
    place-items: center;
    padding: 18px;
    z-index: 30;
  }
  .scrim[hidden] { display: none; }

  .sheet {
    width: min(560px, 100%);
    max-height: min(88vh, 760px);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .sheet-head strong {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .sheet-body { padding: 16px; overflow-y: auto; flex: 1; }

  .sheet-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--rule);
    background: var(--surface);
  }

  .progress {
    height: 4px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    margin: 14px 0 8px;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width .25s ease;
  }

  .scan-status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .scan-hint {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0;
  }
  .scan-hint + .scan-hint { margin-top: 8px; }

  .drop {
    border: 1px dashed var(--rule);
    border-radius: var(--r);
    padding: 26px 18px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .drop.over { border-color: var(--accent); background: var(--surface-2); }
  .drop-icon { font-size: 30px; line-height: 1; }

  /* ---------- pinned receipt photo ---------- */

  .photo {
    display: block;
    width: 100%;
    max-height: 460px;
    object-fit: contain;
    object-position: top center;
    border-radius: var(--r);
    border: 1px solid var(--rule-soft);
    background: var(--surface-2);
    cursor: zoom-in;
  }

  .photo-note {
    margin: 8px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  .zoom {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(6, 10, 9, .93);
    overflow: hidden;
    touch-action: none;
    display: grid;
    place-items: center;
  }
  .zoom[hidden] { display: none; }
  .zoom img {
    max-width: 100%;
    max-height: 100%;
    transform-origin: 0 0;
    will-change: transform;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .zoom img:active { cursor: grabbing; }

  .zoom-close {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: 14px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(6, 10, 9, .6);
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .zoom-hint {
    position: absolute;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(6, 10, 9, .7);
    border: 1px solid rgba(255, 255, 255, .16);
    color: rgba(255, 255, 255, .82);
    font-family: var(--font-mono);
    font-size: 11px;
    white-space: nowrap;
    transition: opacity .4s ease;
  }

  .stage {
    position: relative;
    line-height: 0;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    overflow: hidden;
    background: var(--surface-2);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: crosshair;
  }
  .stage canvas { width: 100%; height: auto; display: block; }

  .sel {
    position: absolute;
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 9999px rgba(6, 10, 9, .58);
    cursor: move;
    box-sizing: border-box;
  }
  .sel::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px dashed rgba(0, 0, 0, .45);
    pointer-events: none;
  }

  .handle {
    position: absolute;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
  }
  .handle::before {
    content: "";
    width: 12px;
    height: 12px;
    background: #fff;
    border: 1.5px solid rgba(6, 10, 9, .5);
    border-radius: 3px;
  }
  .handle.nw { top: -13px; left: -13px; cursor: nwse-resize; }
  .handle.ne { top: -13px; right: -13px; cursor: nesw-resize; }
  .handle.sw { bottom: -13px; left: -13px; cursor: nesw-resize; }
  .handle.se { bottom: -13px; right: -13px; cursor: nwse-resize; }

  .shot {
    width: 100%;
    max-height: 190px;
    object-fit: contain;
    object-position: center;
    border-radius: var(--r);
    border: 1px solid var(--rule);
    background: var(--surface-2);
    display: block;
    margin-bottom: 14px;
  }

  .found {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .found li {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) 84px;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border: 1px solid var(--rule-soft);
    border-radius: var(--r);
  }
  .found li.off { opacity: .45; }

  .found input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .found .f-name {
    border: 1px solid transparent;
    background: transparent;
    padding: 4px 6px;
    border-radius: 4px;
    width: 100%;
    font-size: 14px;
  }
  .found .f-price {
    border: 1px solid transparent;
    background: transparent;
    padding: 4px 6px;
    border-radius: 4px;
    width: 100%;
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }
  .found .f-name:focus, .found .f-price:focus {
    outline: none;
    border-color: var(--rule);
    background: var(--paper);
  }

  .detected {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .detected-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .detected-row input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
  .detected-row .amt {
    margin-left: auto;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .engine {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .engine .seg { border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
  .engine .seg button {
    width: auto;
    padding: 4px 11px;
    font-family: var(--font-ui);
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
  }

  .pass-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }
  .pass-form input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    background: var(--paper);
    font-family: var(--font-mono);
    font-size: 14px;
  }
  .pass-form input:focus { outline: none; border-color: var(--focus); }
  .pass-error { color: var(--danger); font-size: 13px; margin: 0; }

  .reconcile {
    margin-top: 12px;
    padding: 9px 11px;
    border-radius: var(--r);
    border: 1px solid var(--rule-soft);
    background: var(--paper);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }
  .reconcile.ok { border-color: var(--accent); color: var(--accent); }
  .reconcile.off { border-color: var(--danger); color: var(--danger); }

  .raw {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .raw summary { cursor: pointer; }
  .raw pre {
    margin: 8px 0 0;
    padding: 10px;
    background: var(--paper);
    border: 1px solid var(--rule-soft);
    border-radius: var(--r);
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    max-height: 180px;
    overflow: auto;
    white-space: pre-wrap;
  }

  .spin {
    width: 15px; height: 15px;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    .scrim { padding: 0; place-items: end stretch; }
    .sheet { max-height: 94vh; border-radius: 10px 10px 0 0; border-bottom: 0; }
    .sheet-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>Split</h1>
      <p id="stamp">who owes what, to the cent</p>
    </div>
    <div class="masthead-actions">
      <button class="btn" id="shareBtn">Share</button>
      <button class="btn btn-danger" id="clearBtn">Clear all</button>
    </div>
  </header>

  <main class="layout">
    <div class="ledger">

      <section class="panel">
        <div class="panel-head">
          <span class="eyebrow">People</span>
          <button class="btn" id="addPerson">Add person</button>
        </div>
        <div class="people-list" id="peopleList"></div>
      </section>

      <section class="panel" id="photoPanel" hidden>
        <div class="panel-head">
          <span class="eyebrow">Receipt photo</span>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="photoToggle">Hide</button>
            <button class="btn btn-danger" id="photoRemove">Remove</button>
          </div>
        </div>
        <div id="photoWrap"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="eyebrow">Items</span>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="scanBtn">Scan receipt</button>
            <button class="btn btn-solid" id="addItem">Add item</button>
          </div>
        </div>
        <form class="askrow" id="askRow" hidden autocomplete="off">
          <input id="askInput" type="text"
                 placeholder="Who had what? e.g. Arjun and Smyan shared the seafood, we all had dessert"
                 aria-label="Describe who shared what" />
          <button class="btn btn-solid" id="askBtn" type="submit">Assign</button>
        </form>

        <div class="items" id="itemList"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="eyebrow">Tax &amp; tip</span>
        </div>
        <div class="charge-grid">
          <div class="charge">
            <label for="taxInput">Tax</label>
            <div class="charge-input">
              <input id="taxInput" type="text" inputmode="decimal" data-charge="tax" />
              <div class="seg">
                <button type="button" data-mode="tax:amt" aria-pressed="false">$</button>
                <button type="button" data-mode="tax:pct" aria-pressed="false">%</button>
              </div>
            </div>
            <p class="charge-hint" id="taxHint"></p>
          </div>
          <div class="charge">
            <label for="tipInput">Tip</label>
            <div class="charge-input">
              <input id="tipInput" type="text" inputmode="decimal" data-charge="tip" />
              <div class="seg">
                <button type="button" data-mode="tip:amt" aria-pressed="false">$</button>
                <button type="button" data-mode="tip:pct" aria-pressed="false">%</button>
              </div>
            </div>
            <p class="charge-hint" id="tipHint"></p>
            <div class="presets" id="tipPresets"></div>
          </div>
        </div>
      </section>

    </div>

    <aside class="receipt" id="receipt"></aside>
  </main>
</div>

<div class="totalbar">
  <span class="eyebrow">Grand total</span>
  <span class="amt" id="barTotal">$0.00</span>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" hidden />

<div class="zoom" id="zoom" hidden>
  <img id="zoomImg" alt="Your receipt photo" draggable="false" />
  <button class="zoom-close" id="zoomClose" aria-label="Close">×</button>
  <div class="zoom-hint" id="zoomHint">Pinch or scroll to zoom · drag to pan · double-tap to reset</div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <strong id="sheetTitle">Scan receipt</strong>
      <button class="icon-btn" id="sheetClose" aria-label="Close">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "split.receipt.v2";
  var PALETTE = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)", "var(--p5)", "var(--p6)"];

  var uid = function () { return Math.random().toString(36).slice(2, 9); };

  var seed = function () {
    return {
      people: [],
      items: [],
      tax: { mode: "amt", value: 0 },
      tip: { mode: "amt", value: 0 },
      open: {}
    };
  };

  var state;
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    state = saved && Array.isArray(saved.people) ? saved : seed();
  } catch (e) { state = seed(); }
  if (!state.open) state.open = {};

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // The photo lives under its own key: it's far bigger than everything else,
  // so a quota failure here must never cost you the receipt itself.
  var PHOTO_KEY = "split.photo.v2";
  var photo = null;
  try { photo = localStorage.getItem(PHOTO_KEY); } catch (e) {}

  function savePhoto() {
    try {
      if (photo) localStorage.setItem(PHOTO_KEY, photo);
      else localStorage.removeItem(PHOTO_KEY);
    } catch (e) {
      say("Photo is too big to store — it'll stay until you reload the page.");
    }
  }

  var money = function (n) {
    return (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2);
  };
  var num = function (v) {
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    return isFinite(n) ? n : 0;
  };
  var colorOf = function (id) {
    var i = state.people.findIndex(function (p) { return p.id === id; });
    return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
  };
  var personById = function (id) {
    return state.people.find(function (p) { return p.id === id; });
  };
  var nameOf = function (id) {
    var p = personById(id);
    return p ? (p.name || "Unnamed") : "?";
  };

  // ---- the math ----------------------------------------------------------
  // Each item is split evenly among the people sharing it. Tax and tip are
  // then allocated in proportion to what each person's items came to.
  function compute() {
    var ids = state.people.map(function (p) { return p.id; });
    var subtotals = {}, lines = {};
    ids.forEach(function (id) { subtotals[id] = 0; lines[id] = []; });

    state.items.forEach(function (it) {
      var sharers = it.shared.filter(function (id) { return ids.indexOf(id) !== -1; });
      if (!sharers.length) return;
      var each = num(it.price) / sharers.length;
      sharers.forEach(function (id) {
        subtotals[id] += each;
        lines[id].push({
          label: (it.name || "Item") + ": " + num(it.price).toFixed(2) + "/" + sharers.length,
          amount: each
        });
      });
    });

    var itemsTotal = state.items.reduce(function (s, it) { return s + num(it.price); }, 0);
    var assigned = ids.reduce(function (s, id) { return s + subtotals[id]; }, 0);

    var tax = state.tax.mode === "pct" ? assigned * num(state.tax.value) / 100 : num(state.tax.value);
    var tip = state.tip.mode === "pct" ? assigned * num(state.tip.value) / 100 : num(state.tip.value);
    var extra = tax + tip;

    var totals = {}, shares = {};
    ids.forEach(function (id) {
      shares[id] = assigned > 0 ? subtotals[id] / assigned : 0;
      totals[id] = subtotals[id] + shares[id] * extra;
    });

    // Largest-remainder rounding so the per-person cents add up to the bill.
    var grand = Math.round((assigned + extra) * 100);
    var cents = ids.map(function (id) {
      var raw = totals[id] * 100;
      return { id: id, floor: Math.floor(raw), frac: raw - Math.floor(raw) };
    });
    var placed = cents.reduce(function (s, c) { return s + c.floor; }, 0);
    var left = grand - placed;
    cents.slice().sort(function (x, y) { return y.frac - x.frac; })
      .forEach(function (c, i) { c.extraCent = i < left ? 1 : 0; });
    var rounded = {};
    cents.forEach(function (c) { rounded[c.id] = (c.floor + (c.extraCent || 0)) / 100; });

    var orphans = ids.length ? state.items.filter(function (it) {
      return !it.shared.filter(function (id) { return ids.indexOf(id) !== -1; }).length;
    }) : [];

    return {
      ids: ids, subtotals: subtotals, lines: lines, shares: shares,
      totals: rounded, assigned: assigned, itemsTotal: itemsTotal,
      tax: tax, tip: tip, extra: extra, grand: assigned + extra, orphans: orphans
    };
  }

  // ---- rendering ---------------------------------------------------------
  var peopleList = document.getElementById("peopleList");
  var itemList = document.getElementById("itemList");
  var receipt = document.getElementById("receipt");
  var barTotal = document.getElementById("barTotal");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderPeople() {
    peopleList.textContent = "";
    if (!state.people.length) {
      peopleList.appendChild(el("div", "empty", "Add the people splitting this receipt."));
      return;
    }
    state.people.forEach(function (p) {
      var tag = el("div", "person-tag");
      tag.style.setProperty("--c", colorOf(p.id));

      var input = document.createElement("input");
      input.value = p.name;
      input.setAttribute("aria-label", "Name");
      input.size = Math.max(4, p.name.length);
      input.addEventListener("input", function () {
        p.name = input.value;
        input.size = Math.max(4, input.value.length);
        renderItems();
        renderReceipt();
        save();
      });
      tag.appendChild(input);

      var del = el("button", "icon-btn", "×");
      del.title = "Remove " + p.name;
      del.setAttribute("aria-label", "Remove " + p.name);
      del.addEventListener("click", function () {
        state.people = state.people.filter(function (q) { return q.id !== p.id; });
        state.items.forEach(function (it) {
          it.shared = it.shared.filter(function (id) { return id !== p.id; });
        });
        renderAll();
        save();
      });
      tag.appendChild(del);

      peopleList.appendChild(tag);
    });
  }

  function renderItems() {
    itemList.textContent = "";
    if (!state.items.length) {
      itemList.appendChild(el("div", "empty", state.people.length
        ? "No items yet — add the first line off the receipt, or scan it."
        : "Scan the receipt or add items, then describe who had what."));
      return;
    }
    state.items.forEach(function (it, idx) {
      var row = el("div", "item");
      var sharers = it.shared.filter(function (id) { return !!personById(id); });
      // Only an actual mistake once there's somebody it could have been assigned to.
      if (!sharers.length && state.people.length) row.classList.add("orphan");

      var top = el("div", "item-top");

      var name = document.createElement("input");
      name.className = "field field-name";
      name.value = it.name;
      name.placeholder = "Item";
      name.setAttribute("aria-label", "Item name");
      name.addEventListener("input", function () { it.name = name.value; renderReceipt(); save(); });
      name.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && idx === state.items.length - 1) addItem();
      });
      top.appendChild(name);

      var price = document.createElement("input");
      price.className = "field field-price";
      price.type = "text";
      price.inputMode = "decimal";
      price.value = it.price === "" ? "" : Number(it.price).toFixed(2);
      price.placeholder = "0.00";
      price.setAttribute("aria-label", "Price");
      price.addEventListener("input", function () {
        it.price = num(price.value);
        updateNote(row, it);
        renderReceipt();
        save();
      });
      price.addEventListener("blur", function () {
        price.value = Number(num(price.value)).toFixed(2);
      });
      price.addEventListener("focus", function () { price.select(); });
      top.appendChild(price);

      var del = el("button", "icon-btn", "×");
      del.title = "Remove item";
      del.setAttribute("aria-label", "Remove item");
      del.addEventListener("click", function () {
        state.items = state.items.filter(function (x) { return x.id !== it.id; });
        renderItems();
        renderReceipt();
        save();
      });
      top.appendChild(del);

      row.appendChild(top);

      var chips = el("div", "chiprow");
      state.people.forEach(function (p) {
        var on = it.shared.indexOf(p.id) !== -1;
        var chip = el("button", "chip", p.name || "Unnamed");
        chip.type = "button";
        chip.style.setProperty("--c", colorOf(p.id));
        chip.setAttribute("aria-pressed", on ? "true" : "false");
        chip.addEventListener("click", function () {
          var i = it.shared.indexOf(p.id);
          if (i === -1) it.shared.push(p.id); else it.shared.splice(i, 1);
          chip.setAttribute("aria-pressed", i === -1 ? "true" : "false");
          row.classList.toggle("orphan", !it.shared.filter(function (id) { return !!personById(id); }).length);
          updateNote(row, it);
          renderReceipt();
          save();
        });
        chips.appendChild(chip);
      });

      if (state.people.length) {
        var all = el("button", "chip chip-all");
        all.type = "button";
        all.textContent = "Everyone";
        all.addEventListener("click", function () {
          var everyone = state.people.length && state.people.every(function (p) {
            return it.shared.indexOf(p.id) !== -1;
          });
          it.shared = everyone ? [] : state.people.map(function (p) { return p.id; });
          renderItems();
          renderReceipt();
          save();
        });
        chips.appendChild(all);
      }

      var note = el("span", "split-note");
      chips.appendChild(note);
      row.appendChild(chips);
      itemList.appendChild(row);
      updateNote(row, it);
    });
  }

  function updateNote(row, it) {
    var note = row.querySelector(".split-note");
    if (!note) return;
    var n = it.shared.filter(function (id) { return !!personById(id); }).length;
    if (!n) {
      note.textContent = state.people.length ? "unassigned" : "";
      note.classList.toggle("warn", !!state.people.length);
    } else {
      note.classList.remove("warn");
      note.textContent = n > 1 ? money(num(it.price) / n) + " each" : "";
    }
  }

  function renderCharges() {
    ["tax", "tip"].forEach(function (k) {
      var input = document.querySelector('[data-charge="' + k + '"]');
      if (document.activeElement !== input) {
        input.value = state[k].value === 0 ? "" : String(state[k].value);
      }
      input.placeholder = state[k].mode === "pct" ? "0" : "0.00";
      document.querySelectorAll('[data-mode^="' + k + ':"]').forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.mode === k + ":" + state[k].mode ? "true" : "false");
      });
    });
  }

  function renderReceipt() {
    var r = compute();

    receipt.textContent = "";

    var head = el("div", "receipt-head");
    head.appendChild(el("strong", null, "The damage"));
    head.appendChild(el("span", "eyebrow", state.people.length + (state.people.length === 1 ? " person" : " people")));
    receipt.appendChild(head);

    var tally = el("div", "tally");
    var line = function (label, amount, cls) {

  // Keep the readable colour version, not the black-and-white one OCR reads.
  function makePhoto(bmp, rect) {
    var r = rect || { x: 0, y: 0, w: bmp.width, h: bmp.height };
    var scale = Math.min(1, 1200 / r.w);
    var cw = Math.round(r.w * scale), ch = Math.round(r.h * scale);
    var c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    var ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, r.x, r.y, r.w, r.h, 0, 0, cw, ch);
    return c.toDataURL("image/jpeg", 0.72);
  }

  function attachPhoto(bmp, rect) {
    try {
      photo = makePhoto(bmp, rect);
      state.photoOpen = true;
      savePhoto();
      renderPhoto();
      save();
    } catch (e) { /* a photo is a bonus, never a blocker */ }
  }

  // ---- zoom --------------------------------------------------------------
  var zoom = document.getElementById("zoom");
  var zoomImg = document.getElementById("zoomImg");
  var zoomHint = document.getElementById("zoomHint");
  var zs = 1, zx = 0, zy = 0, pointers = {}, pinch = null, panFrom = null, hintTimer;

  function applyZoom() {
    zoomImg.style.transform = "translate(" + zx + "px," + zy + "px) scale(" + zs + ")";
  }
  function resetZoom() { zs = 1; zx = 0; zy = 0; applyZoom(); }

  function openZoom() {
    zoomImg.src = photo;
    zoom.hidden = false;
    document.body.style.overflow = "hidden";
    resetZoom();
    zoomHint.style.opacity = "1";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { zoomHint.style.opacity = "0"; }, 2600);
  }
  function closeZoom() {
    zoom.hidden = true;
    if (scrim.hidden) document.body.style.overflow = "";
    pointers = {}; pinch = null; panFrom = null;
  }

  document.getElementById("zoomClose").addEventListener("click", closeZoom);
  zoom.addEventListener("click", function (e) { if (e.target === zoom) closeZoom(); });
  zoom.addEventListener("dblclick", function (e) { e.preventDefault(); resetZoom(); });

  // Zoom toward the cursor so the point under it stays put.
  zoom.addEventListener("wheel", function (e) {
    e.preventDefault();
    var next = Math.min(6, Math.max(1, zs * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    var b = zoomImg.getBoundingClientRect();
    var px = e.clientX - b.left, py = e.clientY - b.top;
    zx -= px * (next / zs - 1);
    zy -= py * (next / zs - 1);
    zs = next;
    if (zs === 1) { zx = 0; zy = 0; }
    applyZoom();
  }, { passive: false });

  zoom.addEventListener("pointerdown", function (e) {
    if (e.target === zoom) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var a = pointers[ids[0]], b2 = pointers[ids[1]];
      pinch = { d: Math.hypot(a.x - b2.x, a.y - b2.y), s: zs };
      panFrom = null;
    } else {
      panFrom = { x: e.clientX - zx, y: e.clientY - zy };
    }
    zoom.setPointerCapture(e.pointerId);
  });

  zoom.addEventListener("pointermove", function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (pinch && ids.length === 2) {
      var a = pointers[ids[0]], b2 = pointers[ids[1]];
      var d = Math.hypot(a.x - b2.x, a.y - b2.y);
      zs = Math.min(6, Math.max(1, pinch.s * (d / pinch.d)));
      if (zs === 1) { zx = 0; zy = 0; }
      applyZoom();
    } else if (panFrom) {
      zx = e.clientX - panFrom.x;
      zy = e.clientY - panFrom.y;
      applyZoom();
    }
  });

  var dropPointer = function (e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinch = null;
    if (!Object.keys(pointers).length) panFrom = null;
  };
  zoom.addEventListener("pointerup", dropPointer);
  zoom.addEventListener("pointercancel", dropPointer);

  // ---- describe-the-split ------------------------------------------------
  var askRow = document.getElementById("askRow");
  var askInput = document.getElementById("askInput");
  var askBtn = document.getElementById("askBtn");

  function renderAsk() {
    // Available as soon as there are items — naming people is part of what a
    // sentence can do, so it must not require people to already exist.
    askRow.hidden = !state.items.length;
    askInput.placeholder = state.people.length
      ? "Who had what? e.g. Arjun and Smyan shared the seafood, we all had dessert"
      : "Describe the split — e.g. Rahul got the chicken, Arjun and Smyan shared the seafood";
  }

  function setAskBusy(busy) {
    askRow.classList.toggle("busy", busy);
    askInput.disabled = busy;
    askBtn.disabled = busy;
    askBtn.textContent = busy ? "Reading…" : "Assign";
  }

  var nameKey = function (n) { return String(n || "").trim().toLowerCase(); };

  function showAssignPreview(instruction, data) {
    openSheet();
    document.getElementById("sheetTitle").textContent = "Who had what";
    sheetBody.textContent = "";

    // People the sentence introduces don't exist yet, so preview them by the
    // colour they'd be given once created.
    var newPeople = (data.newPeople || []).filter(function (name) {
      return !state.people.some(function (p) { return nameKey(p.name) === nameKey(name); });
    });
    var prospectiveColor = function (name) {
      var i = state.people.findIndex(function (p) { return nameKey(p.name) === nameKey(name); });
      if (i < 0) i = state.people.length + newPeople.indexOf(name);
      return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
    };

    // Only surface entries that actually change something — the model is told
    // to omit untouched items, but an echo of the current state is still a
    // no-op and shouldn't be presented as a change to approve.
    var changes = (data.assignments || []).filter(function (a) {
      var it = state.items[a.item];
      if (!it) return false;
      var next = a.people.map(nameKey).sort();
      var now = it.shared
        .filter(function (id) { return !!personById(id); })
        .map(function (id) { return nameKey(nameOf(id)); })
        .sort();
      return next.join("␀") !== now.join("␀");
    });

    sheetBody.appendChild(el("p", "scan-hint", "“" + instruction + "”"));

    if (newPeople.length) {
      var add = el("div", "change");
      add.style.borderTop = "0";
      add.style.marginTop = "10px";
      add.appendChild(el("div", "change-name", newPeople.length === 1 ? "New person" : "New people"));
      var names = el("div", "change-who");
      newPeople.forEach(function (name, n) {
        if (n) names.appendChild(document.createTextNode(", "));
        var b = el("b", null, name);
        b.style.color = prospectiveColor(name);
        names.appendChild(b);
      });
      add.appendChild(names);
      sheetBody.appendChild(add);
    }

    if (!changes.length && !newPeople.length) {
      sheetBody.appendChild(el("p", "scan-hint",
        data.note || "That didn't change anything. Try naming the people and items more directly."));
    } else if (changes.length) {
      var list = el("div");
      list.style.marginTop = newPeople.length ? "4px" : "14px";
      changes.forEach(function (a) {
        var row = el("div", "change");
        row.appendChild(el("div", "change-name", state.items[a.item].name || "Item"));

        var who = el("div", "change-who");
        if (!a.people.length) {
          who.appendChild(el("span", "none", "nobody"));
        } else {
          a.people.forEach(function (name, n) {
            if (n) who.appendChild(document.createTextNode(", "));
            var b = el("b", null, name);
            b.style.color = prospectiveColor(name);
            who.appendChild(b);
          });
        }
        row.appendChild(who);
        list.appendChild(row);
      });
      sheetBody.appendChild(list);
    }

    var unmatched = (data.unmatched || [])
      .map(function (i) { return state.items[i]; })
      .filter(Boolean);
    if (unmatched.length) {
      var flag = el("div", "flag");
      flag.textContent = "Left alone: " +
        unmatched.map(function (i) { return i.name || "Item"; }).join(", ") +
        " — say who had these and run it again.";
      sheetBody.appendChild(flag);
    }

    if (data.note && changes.length) {
      sheetBody.appendChild(el("p", "scan-hint", data.note));
    }

    var total = changes.length + newPeople.length;
    var cancel = el("button", "btn", total ? "Cancel" : "Back");
    cancel.type = "button";
    cancel.addEventListener("click", closeSheet);

    var foot = [cancel];
    if (total) {
      var label = changes.length
        ? "Apply " + changes.length + (changes.length === 1 ? " change" : " changes")
        : "Add " + newPeople.length + (newPeople.length === 1 ? " person" : " people");
      var apply = el("button", "btn btn-solid", label);
      apply.type = "button";
      apply.addEventListener("click", function () {
        newPeople.forEach(function (name) {
          state.people.push({ id: uid(), name: name });
        });

        var idFor = function (name) {
          var p = state.people.find(function (q) { return nameKey(q.name) === nameKey(name); });
          return p ? p.id : null;
        };
        changes.forEach(function (a) {
          var it = state.items[a.item];
          if (!it) return;
          it.shared = a.people.map(idFor).filter(Boolean);
        });

        renderAll();
        renderHints();
        save();
        closeSheet();
        askInput.value = "";
        var said = [];
        if (newPeople.length) said.push("added " + newPeople.length +
          (newPeople.length === 1 ? " person" : " people"));
        if (changes.length) said.push("assigned " + changes.length +
          (changes.length === 1 ? " item" : " items"));
        say(said.join(", ").replace(/^./, function (c) { return c.toUpperCase(); }));
      });
      foot.push(apply);
    }
    setFoot(foot);
  }

  async function askAssign() {
    var instruction = askInput.value.trim();
    if (!instruction) return;

    setAskBusy(true);
    var res, body;
    try {
      res = await fetch("/api/assign", {
        method: "POST",
        headers: passHeaders(),
        body: JSON.stringify({
          instruction: instruction,
          people: state.people.map(function (p) { return p.name || "Unnamed"; }),
          items: state.items.map(function (it) {
            return {
              name: it.name || "Item",
              price: num(it.price),
              shared: it.shared
                .filter(function (id) { return !!personById(id); })
                .map(function (id) { return nameOf(id); }),
            };
          }),
        }),
      });
      body = await res.json().catch(function () { return {}; });
    } catch (e) {
      setAskBusy(false);
      say("Couldn't reach the assistant");
      return;
    }
    setAskBusy(false);

    if (res.status === 401) {
      var hadPass = !!scanPass;
      scanPass = null;
      try { localStorage.removeItem(PASS_KEY); } catch (e) {}
      askPassphrase(function () { closeSheet(); askAssign(); },
        hadPass ? "That passphrase wasn't right." : null, closeSheet);
      return;
    }
    if (!res.ok) {
      say(body.error || "That didn't work");
      return;
    }

    showAssignPreview(instruction, body);
  }

  // Tip shortcuts. Set as a percentage rather than a fixed amount so the tip
  // still tracks the bill if items change afterwards, and computed off the
  // pre-tax subtotal — the convention, and the base the app already uses.
  var TIP_PRESETS = [15, 18, 20, 22];
  var tipPresets = document.getElementById("tipPresets");

  function renderTipPresets(r) {
    tipPresets.textContent = "";

  var toast = document.getElementById("toast");
  var toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");

  // The plain-text form mirrors the original script's output line for line.
  function summaryText() {
    var r = compute();
    var out = [];
    r.ids.forEach(function (id) {
      out.push(nameOf(id) + ":");
      r.lines[id].forEach(function (l) {
        out.push("- " + l.label + " = " + l.amount.toFixed(2));
      });
      out.push("- subtotal: " + r.subtotals[id].toFixed(2));
      out.push("- tax+tip: (" + r.subtotals[id].toFixed(2) + "/" +
               r.assigned.toFixed(2) + ") * " + r.extra.toFixed(2));
      out.push("- total: " + r.totals[id].toFixed(2));
      out.push("");
    });
    return out.join("\n").trim();
  }

  function copyText(text, okMsg) {
    var done = function () { say(okMsg); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { say("Couldn't copy — select the text and copy manually"); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  // The shared image is deliberately light-themed and self-contained: it gets
  // pasted into someone else's chat, where our dark palette would read as
  // broken. Drawn on a canvas rather than screenshotting the DOM so there's
  // no library and no dependence on how the page happens to be laid out.
  var IMG = {
    bg: "#141A18", ink: "#EDF2ED", soft: "#B9C2BC", muted: "#8B968F",
    rule: "#39443F", faint: "#252D2A", accent: "#5FCCAC",
    people: ["#E07457", "#5A9BD0", "#9C80D2", "#C1992A", "#CE6791", "#2BA3B0"],
  };
  var SANS = 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif';
  var MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  function colorIndexOf(id) {
    var i = state.people.findIndex(function (p) { return p.id === id; });
    return (i < 0 ? 0 : i) % IMG.people.length;
  }

  function ellipsize(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
    return t + "…";
  }

  // Runs twice: once with draw=false to measure the height, once to paint.
  function paintSummary(ctx, W, r, draw) {
    var pad = 44, right = W - pad, y = pad;

    var put = function (text, x, font, color, align) {
      ctx.font = font;
      if (!draw) return;
      ctx.fillStyle = color;
      ctx.textAlign = align || "left";
      ctx.fillText(text, x, y);
    };
    var rule = function (color, dash) {
      if (!draw) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      ctx.moveTo(pad, y + 0.5);
      ctx.lineTo(right, y + 0.5);
      ctx.stroke();
      ctx.setLineDash([]);
    };

    y += 18;
    put("S P L I T", pad, '600 15px ' + SANS, IMG.muted);
    put(new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
        right, '13px ' + MONO, IMG.muted, "right");

    y += 52;
    put(money(r.grand), pad, '700 44px ' + SANS, IMG.accent);
    put(r.ids.length + (r.ids.length === 1 ? " person" : " people"),
        right, '14px ' + MONO, IMG.muted, "right");

    y += 24;
    put("Subtotal " + money(r.assigned) + "   ·   Tax " + money(r.tax) + "   ·   Tip " + money(r.tip),
        pad, '13px ' + MONO, IMG.muted);

    y += 22;
    rule(IMG.rule);

    r.ids.forEach(function (id) {
      var color = IMG.people[colorIndexOf(id)];
      y += 34;

      if (draw) {
        ctx.fillStyle = color;
        ctx.fillRect(pad, y - 15, 4, 20);
      }
      put(nameOf(id), pad + 16, '600 20px ' + SANS, color);
      put(money(r.totals[id]), right, '700 22px ' + SANS, IMG.ink, "right");

      y += 10;
      ctx.font = '13px ' + MONO;
      var labelMax = W - pad * 2 - 16 - 110;

      r.lines[id].forEach(function (l) {
        y += 21;
        put(ellipsize(ctx, l.label, labelMax), pad + 16, '13px ' + MONO, IMG.muted);
        put(l.amount.toFixed(2), right, '13px ' + MONO, IMG.muted, "right");
      });

      y += 12;
      rule(IMG.faint);
      y += 20;
      put("subtotal", pad + 16, '13px ' + MONO, IMG.soft);
      put(r.subtotals[id].toFixed(2), right, '13px ' + MONO, IMG.soft, "right");

      y += 21;
      put(ellipsize(ctx, "tax+tip: (" + r.subtotals[id].toFixed(2) + "/" +
          r.assigned.toFixed(2) + ") * " + r.extra.toFixed(2), labelMax),
          pad + 16, '13px ' + MONO, IMG.muted);
      put((r.totals[id] - r.subtotals[id]).toFixed(2), right, '13px ' + MONO, IMG.muted, "right");

      y += 23;
      put("total", pad + 16, '600 14px ' + MONO, IMG.ink);
      put(r.totals[id].toFixed(2), right, '600 14px ' + MONO, IMG.ink, "right");

      y += 18;
      rule(IMG.rule, [3, 4]);
    });

    y += 30;
    put("split-gilt-pi.vercel.app", W / 2, '12px ' + MONO, IMG.muted, "center");

    return y + pad - 12;
  }

  function summaryCanvas() {
    var r = compute();

    var probe = document.createElement("canvas").getContext("2d");
    var H = Math.round(paintSummary(probe, W, r, false));

    var c = document.createElement("canvas");
    c.width = W * scale;
    c.height = H * scale;
    var ctx = c.getContext("2d");
    ctx.scale(scale, scale);
    ctx.fillStyle = IMG.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";
    paintSummary(ctx, W, r, true);
    return c;
  }

  // ---- receipt scanning --------------------------------------------------
  // OCR runs entirely in this browser via tesseract.js. Nothing is uploaded.
  // OCR on thermal paper is imperfect by nature, so the scan never writes
  // straight into the ledger — it proposes rows you confirm and correct.

  var TESSERACT_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";

  var scrim = document.getElementById("scrim");
  var sheetBody = document.getElementById("sheetBody");
  var sheetFoot = document.getElementById("sheetFoot");
  var fileInput = document.getElementById("fileInput");
  var lastFocus = null;
  var tessLoad = null;
  var worker = null;

  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (tessLoad) return tessLoad;
    tessLoad = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = TESSERACT_SRC;
      s.async = true;
      s.onload = function () {
        window.Tesseract ? resolve(window.Tesseract) : reject(new Error("loaded but empty"));
      };
      s.onerror = function () { reject(new Error("blocked")); };
      document.head.appendChild(s);
    });
    tessLoad.catch(function () { tessLoad = null; });
    return tessLoad;
  }

  function openSheet() {
    lastFocus = document.activeElement;
    scrim.hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    scrim.hidden = true;
    document.body.style.overflow = "";
    sheetBody.textContent = "";
    sheetFoot.textContent = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  scrim.addEventListener("click", function (e) { if (e.target === scrim) closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!zoom.hidden) closeZoom();
    else if (!scrim.hidden) closeSheet();
  });

  // -- image prep: OCR does much better on a big, high-contrast, flat image --
  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: "from-image" })
        .catch(function () { return createImageBitmap(file); });
    }
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  function otsu(hist, total) {
    var sum = 0, i;
    for (i = 0; i < 256; i++) sum += i * hist[i];
    var sumB = 0, wB = 0, best = 0, thresh = 128;
    for (i = 0; i < 256; i++) {
      wB += hist[i];
      if (!wB) continue;
      var wF = total - wB;
      if (!wF) break;
      sumB += i * hist[i];
      var mB = sumB / wB, mF = (sum - sumB) / wF;
      var between = wB * wF * (mB - mF) * (mB - mF);
      if (between > best) { best = between; thresh = i; }
    }
    return thresh;
  }

  // rect is in source-image pixels; omit it to use the whole image.
  function preprocess(bmp, rect) {
    var r = rect || { x: 0, y: 0, w: bmp.width, h: bmp.height };
    // Receipts are tall and thin; aim for a width OCR is comfortable with.
    // Cropping in makes the remaining text bigger, so this often upscales.
    var scale = 1;
    if (r.w > 1800) scale = 1800 / r.w;
    else if (r.w < 1000) scale = Math.min(3, 1000 / r.w);

    var cw = Math.round(r.w * scale), ch = Math.round(r.h * scale);
    var c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    var ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, r.x, r.y, r.w, r.h, 0, 0, cw, ch);

    var img = ctx.getImageData(0, 0, cw, ch);
    var d = img.data;
    var hist = new Uint32Array(256);
    var i, g;
    for (i = 0; i < d.length; i += 4) {
      g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
      d[i] = d[i + 1] = d[i + 2] = g;
      hist[g]++;
    }
    var t = otsu(hist, cw * ch);
    // Soft threshold: push toward black/white but keep a little grey so thin
    // thermal strokes don't disappear entirely.
    var lo = Math.max(0, t - 28), hi = Math.min(255, t + 28);
    for (i = 0; i < d.length; i += 4) {
      g = d[i];
      var v = g <= lo ? 0 : g >= hi ? 255 : Math.round((g - lo) / (hi - lo) * 255);
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // -- turning OCR text into candidate rows --------------------------------
  var NOISE = /(sub\s*-?\s*total|total|balance|amount\s+due|tax|tip|gratuity|change|cash|debit|credit|visa|master|amex|discover|card\b|acct|account|auth|approv|\bref\b|tender|payment|savings|coupon|loyalty|member|reward|points|thank|welcome|receipt|invoice|survey|cashier|register|server|table|guest|\bqty\b|items? sold|item count|www\.|\.com|http|store\s*#|tel\b|phone)/i;
  var PRICE_AT_END = /(-?\$?\s*\d{1,4}[.,]\d{2})\s*[A-Za-z]{0,2}$/;

  function toNumber(raw) {
    return num(String(raw).replace(/[^0-9.,\-]/g, "").replace(",", "."));
  }

  function parseReceipt(text) {
    var lines = text.split(/\r?\n/);
    var items = [], found = { tax: null, tip: null, total: null, subtotal: null };

    lines.forEach(function (rawLine) {
      var line = rawLine.replace(/\s+/g, " ").trim();
      if (line.length < 4) return;

      var m = line.match(PRICE_AT_END);
      if (!m) return;
      var price = toNumber(m[1]);
      var label = line.slice(0, m.index).trim();

      if (NOISE.test(line)) {
        // Pull the useful totals out of the lines we're otherwise ignoring.
        if (/\btips?\b|gratuity/i.test(line) && found.tip === null) found.tip = price;
        else if (/\btax\b/i.test(line) && !/taxable/i.test(line) && found.tax === null) found.tax = price;
        else if (/sub\s*-?\s*total/i.test(line) && found.subtotal === null) found.subtotal = price;
        else if (/total/i.test(line)) found.total = price;
        return;
      }

      label = label
        .replace(/^\d{5,}\s*/, "")            // leading barcode / PLU
        .replace(/\s*\d+\s*@\s*[\d.,]+$/, "") // "2 @ 1.99" tail
        .replace(/[\s.\-–—:*_]+$/, "")
        .replace(/^[\s.\-–—:*_]+/, "")
        .trim();

      if ((label.match(/[A-Za-z]/g) || []).length < 2) return;
      if (!(price > 0) || price > 2000) return;

      items.push({
        name: label.length > 40 ? label.slice(0, 40).trim() : label,
        price: price,
        use: true
      });
    });

    return { items: items, found: found, raw: text };
  }

  // -- sheet states ---------------------------------------------------------
  function setFoot(nodes) {
    sheetFoot.textContent = "";
    nodes.forEach(function (n) { sheetFoot.appendChild(n); });

  function showWork() {
    sheetBody.textContent = "";
    var wrap = el("div");
    var status = el("div", "scan-status");
    var label = el("span", null, "Starting…");
    var pct = el("span", null, "");
    status.appendChild(label);
    status.appendChild(pct);
    var bar = el("div", "progress");
    var fill = document.createElement("span");
    bar.appendChild(fill);
    wrap.appendChild(bar);
    wrap.appendChild(status);
    wrap.appendChild(el("p", "scan-hint",
      "First scan downloads the recognizer (about 15 MB) — after that it's cached and starts instantly."));
    sheetBody.appendChild(wrap);
    setFoot([]);
    return function (text, ratio) {
      label.textContent = text;
      if (ratio == null) { pct.textContent = ""; fill.style.width = "0%"; }
      else {
        pct.textContent = Math.round(ratio * 100) + "%";
        fill.style.width = (ratio * 100).toFixed(1) + "%";
      }
