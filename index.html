<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Split — receipt splitter</title>
<meta name="description" content="Split a receipt among friends: assign each item to whoever shared it, and tax and tip get divided in proportion to what everyone actually ordered." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%BE</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>Split</h1>
      <p id="stamp">who owes what, to the cent</p>
    </div>
    <div class="masthead-actions">
      <button class="btn btn-danger" id="clearBtn">Clear all</button>
    </div>
  </header>

  <main class="layout">
    <div class="ledger">

      <section class="panel">
        <div class="panel-head">
          <span class="eyebrow">People</span>
          <button class="btn" id="addPerson">Add person</button>
        </div>
        <div class="people-list" id="peopleList"></div>
      </section>

      <section class="panel" id="photoPanel" hidden>
        <div class="panel-head">
          <span class="eyebrow">Receipt photo</span>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="photoToggle">Hide</button>
            <button class="btn btn-danger" id="photoRemove">Remove</button>
          </div>
        </div>
        <div id="photoWrap"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="eyebrow">Items</span>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="scanBtn">Scan receipt</button>
            <button class="btn btn-solid" id="addItem">Add item</button>
          </div>
        </div>
        <form class="askrow" id="askRow" hidden autocomplete="off">
          <input id="askInput" type="text"
                 placeholder="Who had what? e.g. Arjun and Smyan shared the seafood, we all had dessert"
                 aria-label="Describe who shared what" />
          <button class="btn btn-solid" id="askBtn" type="submit">Assign</button>
        </form>

        <button class="chip chip-all chip-bulk" id="splitEven" type="button"
                aria-pressed="false" hidden>Split evenly</button>

        <div class="items" id="itemList"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="eyebrow">Tax, tip &amp; discount</span>
        </div>
        <div class="charge-grid">
          <div class="charge">
            <label for="taxInput">Tax</label>
            <div class="charge-input">
              <input id="taxInput" type="text" inputmode="decimal" data-charge="tax" />
              <div class="seg">
                <button type="button" data-mode="tax:amt" aria-pressed="false">$</button>
                <button type="button" data-mode="tax:pct" aria-pressed="false">%</button>
              </div>
            </div>
            <p class="charge-hint" id="taxHint"></p>
          </div>
          <div class="charge">
            <label for="tipInput">Tip</label>
            <div class="charge-input">
              <input id="tipInput" type="text" inputmode="decimal" data-charge="tip" />
              <div class="seg">
                <button type="button" data-mode="tip:amt" aria-pressed="false">$</button>
                <button type="button" data-mode="tip:pct" aria-pressed="false">%</button>
              </div>
            </div>
            <p class="charge-hint" id="tipHint"></p>
            <div class="presets" id="tipPresets"></div>
          </div>
          <div class="charge">
            <label for="discountInput">Discount</label>
            <div class="charge-input">
              <input id="discountInput" type="text" inputmode="decimal" data-charge="discount" />
              <div class="seg">
                <button type="button" data-mode="discount:amt" aria-pressed="false">$</button>
                <button type="button" data-mode="discount:pct" aria-pressed="false">%</button>
              </div>
            </div>
            <p class="charge-hint" id="discountHint"></p>
          </div>
        </div>
      </section>

    </div>

    <aside class="receipt" id="receipt"></aside>
  </main>
</div>

<div class="totalbar">
  <div class="totalbar-sum">
    <span class="eyebrow">Grand total</span>
    <span class="amt" id="barTotal">$0.00</span>
  </div>
  <button class="btn btn-solid" id="barShareBtn" type="button">Share</button>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" hidden />

<div class="zoom" id="zoom" hidden>
  <img id="zoomImg" alt="Your receipt photo" draggable="false" />
  <button class="zoom-close" id="zoomClose" aria-label="Close">×</button>
  <div class="zoom-hint" id="zoomHint">Pinch or scroll to zoom · drag to pan · double-tap to reset</div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <strong id="sheetTitle">Scan receipt</strong>
      <button class="icon-btn" id="sheetClose" aria-label="Close">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
