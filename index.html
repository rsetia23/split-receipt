  // -- AI reading: the model returns item rows directly, so there's no OCR
  // -- text and no parser between the photo and the ledger.
  var PASS_KEY = "split.scanpass.v1";
  var scanPass = null;
  try { scanPass = localStorage.getItem(PASS_KEY); } catch (e) {}

  // The deployment decides whether a passphrase is required. We send one only
  // if we have it, and prompt only when the server actually answers 401 — so an
  // open deployment never asks, and a gated one still works.
  function passHeaders() {
    var h = { "Content-Type": "application/json" };
    if (scanPass) h["X-Split-Pass"] = scanPass;
    return h;
  }

  // Beyond ~1568px on the long edge a receipt photo costs image tokens without
  // adding detail the model can use, so cap it there before uploading.
  function scanImage(bmp, rect) {
    var r = rect || { x: 0, y: 0, w: bmp.width, h: bmp.height };
    var scale = Math.min(1, 1568 / Math.max(r.w, r.h));
    var cw = Math.max(1, Math.round(r.w * scale));
    var ch = Math.max(1, Math.round(r.h * scale));
    var c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    var ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, r.x, r.y, r.w, r.h, 0, 0, cw, ch);
    return c.toDataURL("image/jpeg", 0.8);
  }

  function askPassphrase(onDone, message, onCancel) {
    openSheet();
    sheetBody.textContent = "";
    document.getElementById("sheetTitle").textContent = "Passphrase";
    sheetBody.appendChild(el("p", "scan-hint",
      "Reading with AI runs on this site's own account, so it's behind a passphrase. You only need this once on this device — everything else in the app stays open."));

    var form = el("div", "pass-form");
    if (message) form.appendChild(el("p", "pass-error", message));

    var input = document.createElement("input");
    input.type = "password";
    input.placeholder = "Passphrase";
    input.autocomplete = "current-password";
    input.setAttribute("aria-label", "Passphrase");
    form.appendChild(input);
    sheetBody.appendChild(form);
    setTimeout(function () { input.focus(); }, 30);

    var submit = function () {
      var value = input.value.trim();
      if (!value) return;
      scanPass = value;
      try { localStorage.setItem(PASS_KEY, value); } catch (e) {}
      onDone();
    };
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });

    var cancel = el("button", "btn", "Back");
    cancel.type = "button";
    cancel.addEventListener("click", onCancel || showPick);

    var go = el("button", "btn btn-solid", "Continue");
    go.type = "button";
    go.addEventListener("click", submit);

    setFoot([cancel, go]);
  }

  async function readWithAI(bmp, rect) {
    attachPhoto(bmp, rect);
    var setProgress = showWork();
    setProgress("Reading the receipt…", null);

    var payload;
    try {
      payload = scanImage(bmp, rect);
    } catch (e) {
      showError("Couldn't prepare that image.", String(e && e.message || e));
      return;
    }

    var res, body;
    try {
      res = await fetch("/api/scan", {
        method: "POST",
        headers: passHeaders(),
        body: JSON.stringify({ image: payload }),
      });
      body = await res.json().catch(function () { return {}; });
    } catch (e) {
      showError("Couldn't reach the reader.",
        "Check your connection, or use “Scan offline”, which runs entirely on this device.");
      return;
    }

    if (res.status === 401) {
      var hadPass = !!scanPass;
      scanPass = null;
      try { localStorage.removeItem(PASS_KEY); } catch (e) {}
      askPassphrase(function () { readWithAI(bmp, rect); },
        hadPass ? "That passphrase wasn't right." : null);
      return;
    }
    if (!res.ok) {
      showError(body.error || "The reader failed.",
        (body.detail ? body.detail + "\n\n" : "") +
        "You can still scan offline on this device, or add the items by hand.");
      return;
    }

    var result = {
      items: (body.items || []).map(function (i) {
        return { name: i.name, price: num(i.price), use: true };
      }),
      found: {
        tax: body.tax == null ? null : num(body.tax),
        tip: body.tip == null ? null : num(body.tip),
        subtotal: body.subtotal == null ? null : num(body.subtotal),
        total: body.total == null ? null : num(body.total),
      },
      readBy: body.model || "the reader",
      raw: JSON.stringify(body, null, 2),
    };

    showReview(result, null, bmp, rect);
  }

  // -- crop: the single biggest accuracy win, since it removes the store
  // -- header and payment footer that produce most of the parser's noise.
  function showCrop(bmp) {
    sheetBody.textContent = "";
    document.getElementById("sheetTitle").textContent = "Crop to the items";

    sheetBody.appendChild(el("p", "scan-hint",
      "Drag a box around just the item list. Leaving out the store header and the payment lines makes the reading noticeably more accurate."));

    var stage = el("div", "stage");
    stage.style.marginTop = "12px";

    // Draw the (orientation-corrected) bitmap once at a sane preview size.
    var pw = Math.min(bmp.width, 1200);
    var ph = Math.round(bmp.height * (pw / bmp.width));
    var pc = document.createElement("canvas");
    pc.width = pw; pc.height = ph;
    pc.getContext("2d").drawImage(bmp, 0, 0, pw, ph);
    stage.appendChild(pc);

    var sel = el("div", "sel");
    ["nw", "ne", "sw", "se"].forEach(function (k) {
      sel.appendChild(el("div", "handle " + k));
    });
    stage.appendChild(sel);
    sheetBody.appendChild(stage);

    // Selection is tracked as fractions of the stage so it survives resize.
    var box = { x: 0.06, y: 0.10, w: 0.88, h: 0.72 };

    function paint() {
      sel.style.left = (box.x * 100) + "%";
      sel.style.top = (box.y * 100) + "%";
      sel.style.width = (box.w * 100) + "%";
      sel.style.height = (box.h * 100) + "%";
    }
    paint();

    var drag = null;
    var MIN = 0.04;
    var clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };

    function pos(e) {
      var b = stage.getBoundingClientRect();
      return { x: clamp((e.clientX - b.left) / b.width, 0, 1), y: clamp((e.clientY - b.top) / b.height, 0, 1) };
    }

    stage.addEventListener("pointerdown", function (e) {
      var handle = e.target.classList && e.target.classList.contains("handle") ? e.target : null;
      var p = pos(e);
      stage.setPointerCapture(e.pointerId);
      e.preventDefault();

      if (handle) {
        var corner = handle.className.split(" ").pop();
        drag = { mode: "resize", corner: corner };
      } else if (e.target === sel || sel.contains(e.target)) {
        drag = { mode: "move", dx: p.x - box.x, dy: p.y - box.y };
      } else {
        drag = { mode: "draw", ox: p.x, oy: p.y };
        box = { x: p.x, y: p.y, w: 0, h: 0 };
        paint();
      }
    });

    stage.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var p = pos(e);
      if (drag.mode === "move") {
        box.x = clamp(p.x - drag.dx, 0, 1 - box.w);
        box.y = clamp(p.y - drag.dy, 0, 1 - box.h);
      } else if (drag.mode === "draw") {
        box.x = Math.min(drag.ox, p.x);
        box.y = Math.min(drag.oy, p.y);
        box.w = Math.abs(p.x - drag.ox);
        box.h = Math.abs(p.y - drag.oy);
      } else {
        var right = box.x + box.w, bottom = box.y + box.h;
        if (drag.corner === "nw" || drag.corner === "sw") { box.x = Math.min(p.x, right - MIN); box.w = right - box.x; }
        else { box.w = Math.max(MIN, clamp(p.x, 0, 1) - box.x); }
        if (drag.corner === "nw" || drag.corner === "ne") { box.y = Math.min(p.y, bottom - MIN); box.h = bottom - box.y; }
        else { box.h = Math.max(MIN, clamp(p.y, 0, 1) - box.y); }
      }
      paint();
    });

    var endDrag = function () {
      if (drag && drag.mode === "draw" && (box.w < MIN || box.h < MIN)) {
        box = { x: 0.06, y: 0.10, w: 0.88, h: 0.72 };
        paint();
      }
      drag = null;
    };
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    function rect() {
      return {
        x: Math.round(box.x * bmp.width),
        y: Math.round(box.y * bmp.height),
        w: Math.max(1, Math.round(box.w * bmp.width)),
        h: Math.max(1, Math.round(box.h * bmp.height))
      };
    }

    var extras = el("div");
    extras.style.cssText = "display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;";

    var whole = el("button", "btn btn-quiet", "Use the whole image");
    whole.type = "button";
    whole.addEventListener("click", function () { readWithAI(bmp, null); });
    extras.appendChild(whole);

    // Keeping the photo without reading it is a first-class choice: for a
    // hard receipt it can be faster to read it on screen than to fix guesses.
    var keep = el("button", "btn btn-quiet", "Keep as reference only");
    keep.type = "button";
    keep.addEventListener("click", function () {
      attachPhoto(bmp, rect());
      closeSheet();
      say("Photo pinned above your items");
    });
    extras.appendChild(keep);
    sheetBody.appendChild(extras);

    var offline = el("button", "btn", "Scan offline");
    offline.type = "button";
    offline.title = "Reads on this device with OCR. Free, private, less accurate.";
    offline.addEventListener("click", function () { runScan(bmp, rect()); });

    var ai = el("button", "btn btn-solid", "Read with AI");
    ai.type = "button";
    ai.addEventListener("click", function () { readWithAI(bmp, rect()); });

    setFoot([offline, ai]);
  }

  function showError(title, detail) {
    sheetBody.textContent = "";
    sheetBody.appendChild(el("p", "scan-hint", title));
    if (detail) {
      var d = el("p", "scan-hint", detail);
      d.style.color = "var(--danger)";
      sheetBody.appendChild(d);
    }
    var again = el("button", "btn", "Try another photo");
    again.type = "button";
    again.addEventListener("click", showPick);
    var manual = el("button", "btn btn-solid", "Add items by hand");
    manual.type = "button";
    manual.addEventListener("click", function () { closeSheet(); addItem(); });
    setFoot([again, manual]);
  }

  function showReview(result, previewCanvas, bmp, rect) {
    sheetBody.textContent = "";
    document.getElementById("sheetTitle").textContent = "Review items";

    // The offline scanner shows its thresholded image (what OCR actually saw);
    // the AI path has no such artifact, so it shows the colour crop.
    var shotSrc = previewCanvas ? previewCanvas.toDataURL("image/jpeg", 0.7) : photo;
    if (shotSrc) {
      var shot = document.createElement("img");
      shot.className = "shot";
      shot.alt = previewCanvas ? "The processed image the scanner read" : "The receipt that was read";
      shot.src = shotSrc;
      sheetBody.appendChild(shot);
    }

    if (!result.items.length) {
      sheetBody.appendChild(el("p", "scan-hint",
        "No item lines came through clearly. That usually means the photo is angled, dim, or too small — a straight-on shot cropped to the item list works best."));
      addRawBlock();
      var retry = el("button", "btn", bmp ? "Adjust crop" : "Try another photo");
      retry.type = "button";
      retry.addEventListener("click", function () { bmp ? showCrop(bmp) : showPick(); });
      var byHand = el("button", "btn btn-solid", "Add items by hand");
      byHand.type = "button";
      byHand.addEventListener("click", function () { closeSheet(); addItem(); });
      setFoot([retry, byHand]);
      return;
    }

    sheetBody.appendChild(el("p", "scan-hint", result.readBy
      ? "Read by " + result.readBy + ". Check the lines below — untick anything that isn't an item, and fix any price it got wrong."
      : "Check the lines below — untick anything that isn't an item, and fix any prices OCR got wrong."));

    var list = el("ul", "found");
    list.style.marginTop = "12px";
    result.items.forEach(function (row) {
      var li = document.createElement("li");

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = row.use;
      cb.setAttribute("aria-label", "Include this line");
      cb.addEventListener("change", function () {
        row.use = cb.checked;
        li.classList.toggle("off", !cb.checked);
        countUp();
      });
      li.appendChild(cb);

      var nm = document.createElement("input");
      nm.className = "f-name";
      nm.value = row.name;
      nm.setAttribute("aria-label", "Item name");
      nm.addEventListener("input", function () { row.name = nm.value; });
      li.appendChild(nm);

      var pr = document.createElement("input");
      pr.className = "f-price";
      pr.type = "text";
      pr.inputMode = "decimal";
      pr.value = row.price.toFixed(2);
      pr.setAttribute("aria-label", "Price");
      pr.addEventListener("input", function () { row.price = num(pr.value); countUp(); });
      pr.addEventListener("focus", function () { pr.select(); });
      li.appendChild(pr);

      list.appendChild(li);
    });
    sheetBody.appendChild(list);

    var recon = el("div", "reconcile");
    sheetBody.appendChild(recon);

    var f = result.found;
    var applyTax = { on: f.tax != null }, applyTip = { on: f.tip != null };
    if (f.tax != null || f.tip != null) {
      var det = el("div", "detected");
      det.appendChild(el("div", "eyebrow", "Also spotted"));
      var chargeRow = function (label, value, flag) {
        var r = el("label", "detected-row");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.addEventListener("change", function () { flag.on = cb.checked; });
        r.appendChild(cb);
        r.appendChild(el("span", null, label));
        r.appendChild(el("span", "amt", money(value)));
        det.appendChild(r);
      };
      if (f.tax != null) chargeRow("Use this as tax", f.tax, applyTax);
      if (f.tip != null) chargeRow("Use this as tip", f.tip, applyTip);
      sheetBody.appendChild(det);
    }

    addRawBlock();

    function addRawBlock() {
      var det = document.createElement("details");
      det.className = "raw";
      var sum = document.createElement("summary");
      sum.textContent = previewCanvas ? "Show the raw text OCR read" : "Show what the reader returned";
      det.appendChild(sum);
      var pre = document.createElement("pre");
      pre.textContent = result.raw.trim() || "(nothing)";
      det.appendChild(pre);
      sheetBody.appendChild(det);
    }

    var back = el("button", "btn", bmp ? "Adjust crop" : "Different photo");
    back.type = "button";
    back.addEventListener("click", function () { bmp ? showCrop(bmp) : showPick(); });

    var add = el("button", "btn btn-solid", "");
    add.type = "button";
    add.addEventListener("click", function () {
      var picked = result.items.filter(function (r) { return r.use && num(r.price) > 0; });
      picked.forEach(function (r) {
        state.items.push({
          id: uid(),
          name: r.name || "Item",
          price: num(r.price),
          shared: state.people.map(function (p) { return p.id; })
        });
      });
      if (f.tax != null && applyTax.on) state.tax = { mode: "amt", value: f.tax };
      if (f.tip != null && applyTip.on) state.tip = { mode: "amt", value: f.tip };
      renderAll();
      renderHints();
      save();
      closeSheet();
      say("Added " + picked.length + (picked.length === 1 ? " item" : " items") + " — assigned to everyone");
    });

    function countUp() {
      var live = result.items.filter(function (r) { return r.use && num(r.price) > 0; });
      var n = live.length;
      add.textContent = n ? "Add " + n + (n === 1 ? " item" : " items") : "Nothing selected";
      add.disabled = !n;
      add.style.opacity = n ? "1" : ".5";

      // Cross-check against the subtotal printed on the receipt — the fastest
      // way to catch a price OCR misread before it reaches the split.
      var sum = live.reduce(function (s, r) { return s + num(r.price); }, 0);
      recon.classList.remove("ok", "off");
      if (f.subtotal == null) {
        recon.textContent = "Selected lines add up to " + money(sum) +
          ". No printed subtotal was found to check that against.";
      } else {
        var diff = sum - f.subtotal;
        if (Math.abs(diff) < 0.005) {
          recon.classList.add("ok");
          recon.textContent = "Adds up to " + money(sum) +
            ", matching the subtotal printed on the receipt.";
        } else {
          recon.classList.add("off");
          recon.textContent = "Selected lines add up to " + money(sum) +
            ", but the receipt says " + money(f.subtotal) + " — off by " +
            money(Math.abs(diff)) + ". Check for a misread price or a missing line.";
        }
      }
    }
    countUp();

    setFoot([back, add]);
  }

  async function handleFile(file) {
    if (!file || !/^image\//.test(file.type)) {
      showError("That file isn't an image.", "Pick a photo of the receipt — JPEG, PNG, or HEIC.");
      return;
    }
    var setProgress = showWork();
    try {
      setProgress("Opening the photo…", null);
      var bmp = await loadBitmap(file);
      showCrop(bmp);
    } catch (e) {
      showError("Couldn't read that image.", String(e && e.message || e));
    }
  }

  async function runScan(bmp, rect) {
    attachPhoto(bmp, rect);
    var setProgress = showWork();
    var canvas;
    try {
      setProgress("Preparing the image…", null);
      canvas = preprocess(bmp, rect);
    } catch (e) {
      showError("Couldn't prepare that image.", String(e && e.message || e));
      return;
    }

    var Tess;
    try {
      setProgress("Loading the recognizer…", null);
      Tess = await loadTesseract();
    } catch (e) {
      showError(
        "The text recognizer couldn't load.",
        "It's fetched from a CDN on first use, so this needs a network connection — and it won't run inside a preview that blocks outside scripts. The hosted site is the place to use scanning."
      );
      return;
    }

    try {
      if (!worker) {
        worker = await Tess.createWorker("eng", 1, {
          logger: function (m) {
            var label = /recogniz/i.test(m.status) ? "Reading the receipt…"
              : /download|load|fetch/i.test(m.status) ? "Loading the recognizer…"
              : /initial/i.test(m.status) ? "Warming up…"
              : m.status;
            setProgress(label, typeof m.progress === "number" ? m.progress : null);
          }
        });
        await worker.setParameters({ tessedit_pageseg_mode: "6" });
      } else {
        setProgress("Reading the receipt…", 0.1);
      }

      var res = await worker.recognize(canvas);
      var parsed = parseReceipt(res.data.text || "");
      showReview(parsed, canvas, bmp, rect);
    } catch (e) {
      if (worker) { try { await worker.terminate(); } catch (x) {} worker = null; }
      showError("The scan failed partway through.", String(e && e.message || e));
    }
  }

  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (f) handleFile(f);
  });

  document.getElementById("scanBtn").addEventListener("click", function () {
    openSheet();
    document.getElementById("sheetTitle").textContent = "Scan receipt";
    showPick();
  });

  document.addEventListener("paste", function (e) {
    if (scrim.hidden) return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image") === 0) {
        var f = items[i].getAsFile();
        if (f) { e.preventDefault(); handleFile(f); return; }
      }
    }
  });

  renderAll();
  renderHints();
})();
</script>
</body>
</html>
